name: build-image

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: build-image
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The base image is ~14 GB; a stock runner does not have room for it
      # plus this build without clearing the preinstalled toolchains first.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          sbom: false
          tags: |
            ghcr.io/tmsteph/3dvr-comfyui-faces:latest
            ghcr.io/tmsteph/3dvr-comfyui-faces:sha-${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/tmsteph/3dvr-comfyui-faces:buildcache
          cache-to: type=registry,ref=ghcr.io/tmsteph/3dvr-comfyui-faces:buildcache,mode=max

      # Best effort: make the package world-pullable so RunPod can use it
      # without registry credentials. If this does not take, flip it once in
      # GitHub -> Packages -> 3dvr-comfyui-faces -> Package settings.
      - name: Set package visibility to public
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method PATCH /user/packages/container/3dvr-comfyui-faces \
            -f visibility=public \
          || gh api --method PATCH /users/${{ github.repository_owner }}/packages/container/3dvr-comfyui-faces \
            -f visibility=public \
          || echo "Visibility PATCH failed; set the package public in the GitHub UI."
